<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tambouille</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🥘</text></svg>">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="sidebar" aria-label="Navigation principale">
    <a class="brand" href="/"><span aria-hidden="true">🥘</span> Tambouille</a>
    <div class="links">
      <button data-view="launch" class="on"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15l12-7.5z"/></svg> Lancer</button>
      <button data-view="compare"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h13M13 3l4 4-4 4M20 17H7M11 13l-4 4 4 4"/></svg> Comparer</button>
    </div>
    <hr>
    <div id="campaigns"></div>
  </nav>
  <main>
    <section id="launch" class="view">
      <div id="issues"></div>
      <div class="columns">
        <fieldset>
          <legend>Modèles</legend>
          <div id="models"></div>
        </fieldset>
        <fieldset>
          <legend>Évaluations</legend>
          <div id="categories"></div>
          <details><summary>Choisir des tâches précises</summary><div id="tasks"></div></details>
        </fieldset>
        <fieldset>
          <legend>Durée par modèle</legend>
          <label class="budget"><input id="budget" type="range" min="15" max="600" step="15"><output id="budget-label"></output></label>
          <label class="check"><input id="reference" type="checkbox" checked> Rejouer le modèle de référence si Poney a changé</label>
        </fieldset>
      </div>
      <div id="estimate"></div>
      <button id="run" class="primary"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15l12-7.5z"/></svg> Lancer la campagne</button>
      <p id="run-error" class="error" role="alert"></p>
    </section>

    <section id="history" class="view" hidden>
      <p id="campaign-error" class="error" role="alert"></p>
      <div id="campaign"></div>
      <div id="report"></div>
    </section>

    <section id="compare" class="view" hidden>
      <div class="pickers">
        <label>A <select id="compare-a"></select></label>
        <label>B <select id="compare-b"></select></label>
      </div>
      <div id="comparison"></div>
    </section>
  </main>
  <aside id="panel" aria-label="Détails du modèle" inert></aside>
  <div id="tooltip" role="status" hidden></div>
  <script type="module" src="app.js"></script>
</body>
</html>
